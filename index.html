<title>The Alchemist&#x27;s Advent: the Fifth Candle</title>
<style>
:root{--bg:#0f1b2d;--card:#18283f;--ink:#f1ead7;--dim:#9fb0c8;--gold:#e8b94a;--ok:#4cc38a;--bad:#ff6b6b;--team:#e8b94a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#1d3557,var(--bg) 60%);color:var(--ink);
  font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
header.top h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid #2c4264;
  padding:4px 11px;border-radius:99px;font-size:14px}
.badge i{width:11px;height:11px;border-radius:50%;background:var(--team);display:inline-block}
.card{background:var(--card);border:1px solid #2c4264;border-left:5px solid var(--team);border-radius:14px;
  padding:18px 18px;margin:14px 0;box-shadow:0 6px 24px #0006}
.card h2{margin:.1em 0 .4em;font-size:22px}
.card.ok{border-left-color:var(--ok)}.card.bad{border-left-color:var(--bad)}
.dim{color:var(--dim);font-size:14px}
.kicker{color:var(--gold);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #3b5780;
  background:#0f1b2d;color:var(--ink);margin:8px 0;text-transform:none}
.pin{letter-spacing:.25em;text-transform:uppercase;text-align:center;font-size:22px}
button{font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:10px;background:var(--gold);
  color:#2a1f00;width:100%;cursor:pointer}
button.ghost{background:transparent;color:var(--dim);border:1px solid #3b5780;width:auto;padding:4px 12px;font-size:13px;font-weight:400}
button:disabled{opacity:.5}
.puzzle{white-space:normal}.puzzle img{max-width:100%;border-radius:8px;margin:8px 0}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.tile{background:#0f1b2d;border:1px solid #2c4264;border-radius:12px;padding:10px 4px;text-align:center}
.tile b{display:block;font-size:30px;line-height:1.1;color:var(--dim)}
.tile.got b{color:var(--ok)}.tile span{font-size:12px;color:var(--dim)}
.code{font-size:44px;letter-spacing:.3em;text-align:center;color:var(--gold);font-weight:700;margin:6px 0}
.msg{min-height:1.4em;margin:6px 0 0;font-size:15px}.msg.bad{color:var(--bad)}
details{margin-top:12px}summary{cursor:pointer;color:var(--dim);font-size:14px}
.big{font-size:21px;font-weight:700;color:var(--gold)}

/* ---- Alchemist's Advent theme ---- */
:root{--bg:#0b1a22;--card:#12262f;--gold:#f0c35a;--dim:#9db4bd}
body{background:radial-gradient(circle at 50% -10%,#1b4150,#0b1a22 62%);font-family:Georgia,"Times New Roman",serif}
header.top h1{font-size:13px;letter-spacing:.1em}
.card h2,.big{font-family:Georgia,serif}
.card{border-color:#2a4a58}
.card.story p{margin:.55em 0}
.verse{font-style:italic;color:var(--gold);text-align:center;margin-top:14px !important;font-size:18px}
.owl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px auto;max-width:340px}
.owl img,.owl .empty{display:block;width:100%;aspect-ratio:202/221;object-fit:cover;border-radius:8px}
.owl .empty{background:#0b1a22;border:1px dashed #3b6272;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim)}
.owl .empty span{font-size:34px;line-height:1}.owl .empty small{font-size:12px}
.owl.whole{gap:0;box-shadow:0 0 28px #f0c35a66;border-radius:10px;overflow:hidden}
.owl.whole img{border-radius:0}
.piece{max-width:180px;margin:10px auto}.piece img{width:100%;border-radius:10px;box-shadow:0 0 18px #f0c35a55}
.verses{padding-left:22px;margin:.4em 0}.verses li{margin:.35em 0}
.verseLine{font-style:italic;color:var(--gold);font-size:18px}

.stamp{text-align:center;font-size:20px;color:var(--gold);border:2px dashed var(--gold);border-radius:12px;padding:10px;margin:10px 0}
.stamp #clk{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}

</style>

/* Shared crypto helpers (browser + Node tests). No secrets live here. */
(function (root) {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  const subtle = root.crypto && root.crypto.subtle;

  const normAnswer = s => String(s).normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]/g, '');
  const normPin = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');

  async function decryptJson(key, blob) {
    const raw = b64d(blob);
    const pt = await subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(dec.decode(pt));
  }
  async function open(secret, box, iters) {
    // box = {salt, blob}; key derived from a password-like secret; null if the secret is wrong
    try {
      const km = await subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
      const key = await subtle.deriveKey(
        { name: 'PBKDF2', salt: b64d(box.salt), iterations: iters, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      return await decryptJson(key, box.blob);
    } catch (e) { return null; }
  }
  async function openKey(keyB64, box) {
    // box = {blob}; encrypted directly with a random 256-bit key (used for the shared picture pieces)
    try {
      const key = await subtle.importKey('raw', b64d(keyB64), { name: 'AES-GCM' }, false, ['decrypt']);
      return await decryptJson(key, box.blob);
    } catch (e) { return null; }
  }
  async function stageId(token) {
    return hex(await subtle.digest('SHA-256', enc.encode('id:' + token))).slice(0, 16);
  }
  root.HuntCore = { ok: !!subtle, open, openKey, stageId, normAnswer, normPin };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* The Alchemist's Advent: front end. Every clue and every piece of the seal stays encrypted
   until the right team scans the right QR and answers correctly. */
(function () {
  const H = window.HUNT, C = window.HuntCore, app = document.getElementById('app');
  document.title = H.title;

  // localStorage with in-memory fallback (private browsing / in-app browsers)
  const mem = {};
  const store = {
    get(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return mem[k] ?? null; },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const N = H.rooms.length;

  let session = null; // {pin, team:{i,name,colour,login}}

  const raceStateKey = 'hunt.race.' + H.live?.topic;
  let race = store.get(raceStateKey) || '';
  const raceKey = key => race ? key + '.race.' + race : key;
  let checkingRace = false;
  async function checkRace() {
    if (!H.live || checkingRace) return;
    checkingRace = true;
    try {
      const response = await fetch(H.live.server + '/' + H.live.topic + '/json?poll=1&since=all',
        { cache: 'no-store', signal: AbortSignal.timeout(5000) });
      if (!response.ok) return;
      const starts = [];
      let sawControl = false;
      for (const line of (await response.text()).split('\n')) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.event !== 'message') continue;
        const command = String(event.message).split('.')[0];
        if (command === 'S_c11b6fbd') starts.push(event.id);
        else if (command === 'U_c11b6fbd') starts.pop();
        else continue;
        sawControl = true;
      }
      const latest = starts.at(-1) || '';
      if (sawControl && latest !== race) {
        race = latest;
        store.set(raceStateKey, race);
        if (session) ping(session.team.login);
        await go();
      }
    } catch (_) { /* Keep playing the last known race while offline. */ }
    finally { checkingRace = false; }
  }
  const resKey = () => raceKey('hunt.res.' + session.pin);
  // Only results in the current format count. Leftovers from older test versions are dropped
  // (they used to crash the page and leave it stuck on "Opening…").
  const validRes = r => !!r && typeof r === 'object' && typeof r.img === 'string' && r.img.startsWith('data:image') &&
    Array.isArray(r.verse) && r.verse.length === 2 && Number.isInteger(r.stage);
  function loadRes() {
    let raw; try { raw = JSON.parse(store.get(resKey()) || '{}'); } catch (e) { raw = null; }
    const ok = {}; let dropped = !raw || typeof raw !== 'object';
    for (const [k, v] of Object.entries(raw && typeof raw === 'object' ? raw : {})) {
      if (+k >= 1 && +k <= N && validRes(v)) ok[k] = v; else dropped = true;
    }
    if (dropped) store.set(resKey(), JSON.stringify(ok));
    return ok;
  }
  const saveRes = (room, res) => { const r = loadRes(); r[room] = Object.assign({ t: Date.now() }, res); store.set(resKey(), JSON.stringify(r)); };

  /* ---------- live progress (anonymous proof tokens; queued while offline) ---------- */
  const L = H.live; let flushing = false;
  const jget = (k, d) => { try { const v = JSON.parse(store.get(k) || d); return v && typeof v === 'object' ? v : JSON.parse(d); } catch (e) { return JSON.parse(d); } };
  function ping(k) {
    try {
      if (!L || !k) return;
      const sent = jget(raceKey('hunt.sent'), '{}'), q = jget(raceKey('hunt.q'), '[]');
      if (sent[k] || q.some(e => e && e.k === k)) return;
      q.push({ k, ts: Math.floor(Date.now() / 1000) }); store.set(raceKey('hunt.q'), JSON.stringify(q));
      flush();
    } catch (e) { /* progress reporting must never break the game */ }
  }
  async function flush() {
    if (!L || flushing) return; flushing = true;
    try {
      const queueKey = raceKey('hunt.q'), sentKey = raceKey('hunt.sent');
      const sent = jget(raceKey('hunt.sent'), '{}');
      for (const e of jget(queueKey, '[]')) {
        if (queueKey !== raceKey('hunt.q')) break;
        if (!e || !e.k) continue;
        try {
          const r = await fetch(`${L.server}/${L.topic}`, { method: 'POST', body: `${e.k}.${e.ts}` });
          if (!r.ok) throw new Error('http'); sent[e.k] = 1;
        } catch (err) { continue; }
      }
      store.set(queueKey, JSON.stringify(jget(queueKey, '[]').filter(e => e && !sent[e.k]))); store.set(sentKey, JSON.stringify(sent));
    } catch (e) { /* ignore */ }
    flushing = false;
  }
  const sync = async () => { await checkRace(); await flush(); };
  window.addEventListener('online', sync); setInterval(sync, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });

  function view(inner) {
    const t = session ? `<span class="badge"><i></i>Team ${esc(session.team.name)}</span>` : '';
    app.innerHTML = `<header class="top"><h1>${esc(H.title)}</h1>${t}</header>${inner}`;
    if (session) document.documentElement.style.setProperty('--team', session.team.colour);
    window.scrollTo(0, 0);
  }

  /* ---------- errors and reset: never leave the page hanging ---------- */
  function showError(err) {
    try { console.error(err); } catch (e) {}
    view(`<div class="card bad"><div class="kicker">Something went wrong</div><h2>The Owl is confused</h2>
      <p>Please scan the QR code again. If this keeps happening, reset this phone and log in again with your team PIN.
      Pieces you already won can be won back by scanning your codes and answering again.</p>
      <p class="dim">${esc((err && err.message) || err || 'unknown error')}</p>
      <button id="rs">Reset this phone</button></div>`);
    document.getElementById('rs').onclick = () => { if (confirm(RESET_Q)) { wipe(); clearHash(); go(); } };
  }
  const safe = fn => (...a) => { try { return Promise.resolve(fn(...a)).catch(showError); } catch (e) { showError(e); } };
  const clearHash = () => { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } };
  const RESET_Q = 'Reset this phone? Your login and the pieces saved on this phone are removed.';
  function wipe() {
    const keys = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('hunt.')) keys.push(k); } } catch (e) {}
    Object.keys(mem).forEach(k => keys.push(k));
    keys.forEach(k => store.del(k));
    session = null;
  }

  const storyHtml = () => (H.story ? H.story.intro.map(p => `<p>${p}</p>`).join('') +
    `<p class="verse">${H.story.prologue.map(esc).join('<br>')}</p>` : '');

  /* ---------- login ---------- */
  function loginView(msg) {
    view(`<div class="card story"><div class="kicker">The legend</div>${storyHtml()}</div>
      <div class="card"><div class="kicker">Apprentice, identify yourself</div><h2>Enter your team PIN</h2>
      <p class="dim">The PIN is printed on your team card. You only need to enter it once on this phone.</p>
      <form id="f"><input id="pin" class="pin" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="•••••" maxlength="12">
      <button id="go">Continue</button></form><p class="msg bad" id="m">${msg || ''}</p></div>`);
    document.getElementById('f').onsubmit = safe(async e => {
      e.preventDefault();
      const pin = C.normPin(document.getElementById('pin').value);
      if (!pin) return;
      const b = document.getElementById('go'), m = document.getElementById('m');
      b.disabled = true; m.textContent = 'Checking…'; m.className = 'msg dim';
      const hits = await Promise.all(H.teams.map(t => C.open(pin, t, H.iters)));
      const team = hits.find(Boolean);
      if (!team) { b.disabled = false; m.textContent = 'That PIN is not valid. Check your team card.'; m.className = 'msg bad'; return; }
      session = { pin, team }; ping(team.login);
      store.set('hunt.pin', pin); store.set('hunt.team', JSON.stringify(team));
      await route();
    });
  }
  function logout(msg) { store.del('hunt.pin'); store.del('hunt.team'); session = null; return loginView(msg); }
  const logoutBtn = `<p style="text-align:center;margin-top:30px"><button class="ghost" id="lo">Not your team? Switch team</button></p>`;
  const bindLogout = () => { const b = document.getElementById('lo'); if (b) b.onclick = () => logout(); };

  /* ---------- the seal (4-piece picture) ---------- */
  function seal() {
    const res = loadRes();
    const got = []; for (let r = 1; r <= N; r++) got.push(!!res[r]);
    const whole = got.every(Boolean);
    const cells = got.map((g, i) => g
      ? `<img src="${res[i + 1].img}" alt="piece ${i + 1}">`
      : `<div class="empty"><span>?</span><small>${esc(H.rooms[i])}</small></div>`).join('');
    let extra;
    if (whole) {
      const verses = [...Array(N).keys()].map(i => `<li><b>${esc(res[i + 1].verse[0])}.</b> ${esc(res[i + 1].verse[1])}</li>`).join('');
      const done = Math.max(...Object.values(res).map(r => r.t || 0));
      const hhmm = d => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      extra = `<div class="card ok"><div class="kicker">The seal is whole</div><h2>The Owl lets you pass</h2>
        <p class="stamp">Team ${esc(session.team.name)} · sealed at ${done ? hhmm(done) : '—'}<br><span id="clk"></span></p>
        <p>Show this to the <b>Keeper of the Door</b>. First, read the Master's riddle in order:</p><ol class="verses">${verses}</ol>
        <p class="dim">Your destination: <b>${esc(H.finalRoom)}</b>.</p></div>`;
      setTimeout(() => { const c = document.getElementById('clk'); if (!c) return;
        const tick = () => { if (document.getElementById('clk')) { c.textContent = 'Now ' + new Date().toLocaleTimeString(); setTimeout(tick, 1000); } }; tick(); }, 0);
    } else {
      const verses = [...Array(N).keys()].filter(i => got[i])
        .map(i => `<li><b>${esc(res[i + 1].verse[0])}.</b> ${esc(res[i + 1].verse[1])}</li>`).join('');
      extra = `<p class="dim">${got.filter(Boolean).length} of ${N} pieces found. Win all four to complete the seal.</p>` +
        (verses ? `<p class="kicker" style="margin-top:14px">The Master's riddle so far</p><ol class="verses">${verses}</ol>` : '');
    }
    return `<div class="owl ${whole ? 'whole' : ''}">${cells}</div>${extra}`;
  }

  function homeView() {
    view(`<div class="card story"><div class="kicker">Team ${esc(session.team.name)}</div><h2>The trials await</h2>
      <p>Go to the room named on your team card, find the QR code hidden for <b>your</b> team and scan it with your phone camera.</p></div>
      <div class="card"><div class="kicker">The Owl's seal</div>${seal()}</div>${logoutBtn}`);
    bindLogout();
  }

  /* ---------- stage (a QR was scanned) ---------- */
  async function stageView(token) {
    const stageRace = race;
    view(`<div class="card"><p class="dim">Opening…</p></div>`);
    const entry = H.stages[await C.stageId(token)];
    if (!entry) return view(`<div class="card bad"><h2>Unknown QR code</h2><p>This code is not part of the hunt, or the link is incomplete. Try scanning it again.</p></div>${logoutBtn}`), bindLogout();
    const p = await C.open(token + '|' + session.pin, entry, H.iters);
    if (stageRace !== race) return;
    if (!p) {
      // Is the saved login itself still valid? If not, ask for the PIN again instead of blaming the QR.
      const mine = H.teams[session.team && session.team.i];
      if (!mine || !(await C.open(session.pin, mine, H.iters))) return logout('Please enter your team PIN again.');
      return view(`<div class="card bad"><div class="kicker">Not for you</div><h2>This QR belongs to another team</h2>
      <p>Leave it where it is and keep searching. Your own code is hidden somewhere else in this room.</p></div>${logoutBtn}`), bindLogout();
    }

    ping(p.arrive);
    const saved = loadRes()[p.room];
    const puzzle = `<div class="puzzle">${p.html}${p.image ? `<img src="${esc(p.image)}" alt="">` : ''}</div>`;
    if (saved && saved.stage === p.stage) { ping(saved.proof); return solvedView(p, saved, puzzle); }

    view(`<div class="card"><div class="kicker">${esc(p.roomName)} · trial ${p.stage} of ${p.of}</div><h2>${esc(p.title)}</h2>${puzzle}
      ${p.hint ? `<details><summary>Need a hint?</summary><p>${p.hint}</p></details>` : ''}</div>
      <div class="card"><form id="f"><div class="kicker">Your answer</div>
      <input id="ans" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the solution">
      <button id="go">Offer it to the Owl</button></form><p class="msg" id="m"></p></div>${logoutBtn}`);
    bindLogout();
    document.getElementById('f').onsubmit = safe(async e => {
      e.preventDefault();
      const a = C.normAnswer(document.getElementById('ans').value); if (!a) return;
      const b = document.getElementById('go'), m = document.getElementById('m');
      b.disabled = true; m.textContent = 'The Owl considers…'; m.className = 'msg dim';
      let res = null;
      for (const u of p.unlock) { res = await C.open(a + '|' + token, u, H.iters); if (res) break; }
      if (!res) { b.disabled = false; m.textContent = 'The Owl blinks. Not quite. Think again.'; m.className = 'msg bad'; return; }
      const reward = await C.openKey(res.key, H.rewards[res.piece]);   // the shared picture piece + riddle line
      if (stageRace !== race) return;
      if (!reward) throw new Error('could not open the picture piece');
      const full = Object.assign({}, res, reward); delete full.key;
      saveRes(p.room, full); ping(full.proof);
      solvedView(p, loadRes()[p.room] || full, puzzle);
    });
  }

  function solvedView(p, res, puzzle) {
    const left = N - Object.keys(loadRes()).length;
    const dest = res.nextRoom ? `<p>Your next trial awaits in</p><div class="big">${esc(res.nextName)}</div>` :
      (left === 0 ? `<p>All four trials are won. Open the seal below.</p>` : `<p>Look at the seal below.</p>`);
    view(`<div class="card ok"><div class="kicker">${esc(p.roomName)} · trial ${p.stage} of ${p.of} won</div><h2>Correct!</h2>
      <div class="piece"><img src="${res.img}" alt="your piece"></div>
      <p>A piece of the Owl's seal is yours.</p>
      <p class="verseLine"><b>${esc(res.verse[0])}.</b> ${esc(res.verse[1])}</p>
      ${dest}${res.extra ? `<p>${res.extra}</p>` : ''}</div>
      <div class="card"><div class="kicker">The Owl's seal</div>${seal()}</div>
      <details class="card"><summary>Show this trial again</summary>${puzzle}</details>${logoutBtn}`);
    bindLogout();
  }

  /* ---------- routing ---------- */
  async function route() {
    const token = decodeURIComponent(location.hash.slice(1)).trim();
    if (token.toLowerCase() === 'reset') { clearHash(); if (confirm(RESET_Q)) wipe(); return session ? homeView() : loginView(); }
    if (!session) return loginView();
    return token ? stageView(token) : homeView();
  }
  const go = safe(route);
  window.addEventListener('hashchange', go);

  (async function init() {
    if (!C.ok) return view(`<div class="card bad"><h2>Please open this page in your phone's main browser</h2>
      <p>This browser window cannot unlock the clues. Open the link in Safari or Chrome (look for “Open in browser”).</p></div>`);
    const pin = store.get('hunt.pin'), team = store.get('hunt.team');
    if (pin && team) { try { const t = JSON.parse(team); if (t && typeof t.name === 'string') session = { pin, team: t }; } catch (e) { session = null; } }
    await checkRace();
    if (session) ping(session.team.login);
    go();
  })();
})();

</script>
</body>
</html>
